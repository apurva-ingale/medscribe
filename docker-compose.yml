services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medscribe
      POSTGRES_PASSWORD: medscribe
      POSTGRES_DB: medscribe
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medscribe"]
      interval: 3s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://medscribe:medscribe@db:5432/medscribe
      UPLOAD_DIR: /data/uploads
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: [uploads:/data/uploads, hfcache:/root/.cache]
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes: {pgdata: {}, uploads: {}, hfcache: {}}